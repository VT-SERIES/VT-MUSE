[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vt-muse"
version = "0.1.0"
description = "Multimodal Unified Sequential Visuotactile Representation Learning for Manipulation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "h5py>=3.8",
  "matplotlib>=3.7",
  "numpy>=1.24",
  "Pillow>=9.5",
  "tensorboard>=2.13",
  "torch>=2.0",
  "torchvision>=0.15",
  "tqdm>=4.65",
  "transformers>=4.30",
]

[project.optional-dependencies]
logging = ["wandb>=0.15"]

[tool.setuptools.packages.find]
include = ["vt_muse*"]
